name: Generate Daily Indian Market Dossier

on:
  schedule:
    - cron: '30 13 * * 1-5'
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run Market Dossier Engine
        run: |
          python daily_report_generator.py

      - name: Commit and Push Updated Dossier
        run: |
          git config --global user.name "Market Dossier Bot"
          git config --global user.email "bot@marketdossier.local"
          git pull --rebase origin main || true
          git add index.html daily_market_dossier.html
          git commit -m "Auto-generate Daily Indian Market Dossier [$(date +'%Y-%m-%d %H:%M')]" || exit 0
          git push origin main
